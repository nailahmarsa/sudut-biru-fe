<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sudut Biru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/config.js" defer></script>
  <script src="js/login.js" defer></script>
</head>

<body class="login-page">
  <main class="container-fluid p-0">
    <div class="row g-0 login-layout">

      <section class="col-lg-6 brand-panel" aria-label="Sudut Biru">
        <div class="brand-content">
          <div class="logo-plate">
            <img src="assets/img/Logo plate.svg" alt="Sudut Biru" width="286" height="49">
          </div>

          <div class="brand-story">
            <h1>Temukan Sudut<br>Tenangmu</h1>
            <p>Dari pesanan pertama sampai laporan terakhir,<br class="d-none d-xl-block">semua mengalir dalam satu ruang kerja. </p>
          </div>

          <footer class="brand-footer">
            <p class="fw-semibold mb-2"> Satu sistem, seluruh ritme cafe. </p>
            <p class="mb-0"> Cepat di kasir. Rapi di belakang layar. </p>
          </footer>
        </div>
      </section>

      <!-- Bagian kanan: form login -->
      <section class="col-lg-6 form-panel" aria-labelledby="judul-login">
        <div class="card login-card">
          <div class="card-body">
            <h2 id="judul-login">Selamat datang kembali</h2>
            <p class="login-subtitle"> Masuk ke ruang kerja Sudut Biru. </p>

            <form id="form-login" method="post">
              <fieldset class="role-fieldset">
                <legend>Pilih akses</legend>
                <div class="d-flex gap-3">
                  <div class="flex-fill">
                    <input class="btn-check" type="radio" name="role" id="role-kasir" value="kasir" checked>
                    <label class="btn role-button w-100" for="role-kasir">Kasir </label>
                  </div>

                  <div class="flex-fill">
                    <input class="btn-check" type="radio" name="role" id="role-admin" value="admin">
                    <label class="btn role-button w-100" for="role-admin"> Admin </label>
                  </div>
                </div>
              </fieldset>

              <div class="login-field">
                <label for="username" class="form-label"> Nama pengguna </label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Contoh: Kasir01" autocomplete="username" autocapitalize="none" spellcheck="false" required>
              </div>

              <div class="login-field password-field">
                <label for="password" class="form-label">Kata sandi</label>

                <div class="position-relative">
                  <input type="password" class="form-control password-input" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
                  <button type="button" class="password-toggle" id="toggle-password" aria-label="Tampilkan kata sandi" aria-controls="password" aria-pressed="false">
                    <i id="password-icon" class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <div class="login-options d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="form-check mb-0">
                  <input class="form-check-input" type="checkbox" id="remember" name="remember">
                  <label class="form-check-label" for="remember"> Ingat saya </label>
                </div>
                <a href="lupa-sandi.html" class="btn btn-link forgot-button p-0">Lupa Kata Sandi?</a>
              </div>
              <button type="submit" class="btn btn-primary login-submit w-100" id="login-button">Masuk sebagai kasir</button>
              <p id="login-message" class="login-message mb-0" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
