<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Sudut Biru</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body data-role="admin">
  <main class="container py-5">
    <p id="session-status" role="status">Memeriksa sesi Admin…</p>
    <div id="session-actions" hidden>
      <button type="button" id="retry-session" class="btn btn-primary">Coba lagi</button>
      <a href="../login.html" class="btn btn-link">Kembali ke Login</a>
    </div>
    <section id="workspace" hidden>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <span class="badge text-bg-primary mb-3">Admin</span>
          <h1 class="h3">Selamat datang, <span id="nama-pengguna"></span>!</h1>
          <p class="text-secondary mb-0">Login dan pengecekan sesi Admin berhasil. Dashboard akan dibuat di sini.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
