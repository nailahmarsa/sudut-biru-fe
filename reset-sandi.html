<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubah Kata Sandi | Sudut Biru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="container-fluid p-0">
    <div class="row g-0 login-layout">
      <!-- Panel kiri -->
      <section class="col-lg-6 brand-panel" aria-label="Sudut Biru">
        <div class="brand-content">
          <div class="logo-plate">
            <img src="assets/img/Logo plate.svg" alt="Sudut Biru" width="286" height="49">
          </div>
          <div class="brand-story">
            <h1>Temukan Sudut<br>Tenangmu</h1>
            <p>Dari pesanan pertama sampai laporan terakhir,<br class="d-none d-xl-block">semua mengalir dalam satu ruang kerja.</p>
          </div>
          <footer class="brand-footer">
            <p class="fw-semibold mb-2">Satu sistem, seluruh ritme cafe.</p>
            <p class="mb-0">Cepat di kasir. Rapi di belakang layar.</p>
          </footer>
        </div>
      </section>

      <!-- Form sandi baru -->
      <section class="col-lg-6 form-panel" aria-labelledby="judul-reset">
        <div class="card login-card reset-card">
          <div class="card-body">
            <h2 id="judul-reset">Ubah Kata Sandi</h2>
            <p class="login-subtitle">Buat ulang kata sandimu.</p>
            <form id="form-reset" class="reset-form" method="post">
              <div class="login-field">
                <label for="nama-akun" class="form-label">Nama lengkap</label>
                <input type="text" class="form-control" id="nama-akun" placeholder="Nama akun dari tautan pemulihan" readonly>
              </div>
              <div class="login-field">
                <label for="sandi-baru" class="form-label">Kata sandi baru</label>
                <input type="password" class="form-control" id="sandi-baru" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password" minlength="8" required>
              </div>
              <div class="login-field">
                <label for="konfirmasi-sandi" class="form-label">Konfirmasi kata sandi baru</label>
                <input type="password" class="form-control" id="konfirmasi-sandi" name="password_confirmation" placeholder="Ulangi kata sandi baru" autocomplete="new-password" minlength="8" required>
              </div>
              <p id="pesan-reset" class="login-message" role="status" aria-live="polite"></p>
              <div class="reset-actions">
                <a href="login.html" class="btn reset-cancel">Batal</a>
                <button type="submit" class="btn btn-primary login-submit">Simpan kata sandi</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
