<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menyiapkan Ruang Kerja | Sudut Biru</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="loading-page" data-page="loading">
  <main class="loading-content text-center">
    <img class="loading-logo" src="assets/img/Logo plate.svg" alt="Sudut Biru" width="288" height="49">
    <h1>Menyiapkan ruang kerjamu</h1>
    <p class="loading-description">Sebentar, sudut terbaikmu hampir siap.</p>
    <div class="loading-track" id="loading-track" aria-hidden="true">
      <div class="loading-fill"></div>
    </div>
    <p id="loading-status" class="loading-role" role="status" aria-live="polite">Memeriksa sesi…</p>
    <div id="loading-error" hidden>
      <p id="loading-error-message" class="text-danger small" role="alert"></p>
      <button type="button" id="retry-session" class="btn btn-primary btn-sm">Coba lagi</button>
      <a href="login.html" class="btn btn-link btn-sm">Kembali ke Login</a>
    </div>
  </main>
</body>
</html>
